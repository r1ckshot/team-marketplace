name: validate-plugins
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketplace.json schema and version invariant
        run: |
          python3 - <<'PY'
          import json, re, os
          m = json.load(open('.claude-plugin/marketplace.json'))
          assert 'name' in m and 'owner' in m and 'plugins' in m
          for p in m['plugins']:
              for k in ('name', 'source', 'description', 'version'):
                  assert k in p, f"{p.get('name', '?')}: missing {k}"
              assert re.match(r'^\d+\.\d+\.\d+$', p['version']), p
              plugin_json_path = os.path.join(p['source'], '.claude-plugin', 'plugin.json')
              plugin_json = json.load(open(plugin_json_path))
              assert plugin_json['version'] == p['version'], (
                  f"{p['name']}: marketplace.json has {p['version']}, "
                  f"plugin.json has {plugin_json['version']}"
              )
          print('OK', len(m['plugins']), 'plugins, versions consistent')
          PY

  plugin-validate:
    runs-on: ubuntu-latest
    needs: static-validate
    strategy:
      matrix:
        plugin: [block-env-writes]
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code CLI (native, stable channel)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate plugin manifest (no auth)
        run: claude plugin validate ./plugins/${{ matrix.plugin }}
      - name: Isolated hook test (no auth, no LLM)
        run: bash ./plugins/${{ matrix.plugin }}/hooks/test-block-env-writes.sh
      - name: Smoke install (requires ANTHROPIC_API_KEY)
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --plugin-dir ./plugins/${{ matrix.plugin }} \
                 -p "reply with exactly the word: ready" < /dev/null || exit 1
